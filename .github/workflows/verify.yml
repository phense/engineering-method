name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install skill-discovery test dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
      - name: Validate bundled resources and provenance
        run: python3 scripts/validate-plugin
      - name: Test real local behavior
        run: python3 -m unittest discover -s tests -t . -v
